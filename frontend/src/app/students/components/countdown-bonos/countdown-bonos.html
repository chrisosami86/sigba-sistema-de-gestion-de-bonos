<section class="sticky top-0 z-20 bg-base-100 p-4 shadow-md">
  <div class="mx-auto flex max-w-5xl flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <p class="text-sm font-semibold text-gray-500">Hora actual</p>
      <h2 class="text-3xl font-bold">{{ horaActual() }}</h2>
    </div>

    <div class="text-left sm:text-right">
      <p class="font-bold" [class]="errorMessage() ? 'text-red-700' : 'text-green-700'">
        {{ errorMessage() || mensajePrincipal() }}
      </p>
      @if (loading()) {
        <p class="text-sm text-gray-500">Actualizando informacion...</p>
      }
    </div>
  </div>
</section>
