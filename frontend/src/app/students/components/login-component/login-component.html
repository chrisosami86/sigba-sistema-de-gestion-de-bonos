<form
  class="fieldset bg-base-200 border-base-300 rounded-box w-full max-w-md border p-4 text-lg"
  (submit)="$event.preventDefault(); login()"
>
  <legend class="fieldset-legend">Login</legend>

  <label class="label">Código de estudiante</label>
  <input
    type="text"
    inputmode="numeric"
    class="input w-full"
    placeholder="Codigo institucional"
    autocomplete="username"
    [value]="codigo()"
    (input)="codigo.set(txtUser.value)"
    #txtUser
  />

  <label class="label">Contraseña</label>
  <div class="join w-full">
    <input
      [type]="showPassword() ? 'text' : 'password'"
      class="input join-item w-full"
      placeholder="Contraseña"
      autocomplete="current-password"
      [value]="password()"
      (input)="password.set(txtPassword.value)"
      #txtPassword
    />
    <button
      type="button"
      class="btn join-item"
      [attr.aria-label]="showPassword() ? 'Ocultar contrasena' : 'Mostrar contrasena'"
      (click)="showPassword.set(!showPassword())"
    >
      @if (showPassword()) {
        Ocultar
      } @else {
        Ver
      }
    </button>
  </div>

  @if (errorMessage()) {
    <div class="alert alert-error mt-4 text-sm">
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <button
    type="submit"
    class="btn mt-4 bg-red-600 text-white hover:bg-red-700"
    [disabled]="loading()"
  >
    @if (loading()) {
      Ingresando...
    } @else {
      Ingresar
    }
  </button>

  <div class="divider">o</div>
  <label class="label mx-auto">Recuperar contraseña</label>
  <button type="button" class="btn text-xl font-bold text-red-600" onclick="my_modal_2.showModal()">
    aqui
  </button>

  <modal />
</form>

<!-- Modal obligatorio de cambio de contraseña -->
@if (showForceChange()) {
<div class="modal modal-open">
  <div class="modal-box flex flex-col gap-4">
    <h3 class="text-xl font-bold">Cambio de contraseña obligatorio</h3>
    <p class="text-sm text-gray-600">
      Es tu primer inicio de sesión. Por seguridad, debes cambiar tu contraseña antes de continuar.
    </p>

    <div>
      <label class="label text-sm font-semibold">Nueva contraseña</label>
      <div class="join w-full">
        <input
          [type]="forceShowPasswords() ? 'text' : 'password'"
          class="input join-item w-full"
          placeholder="Minimo 6 caracteres"
          autocomplete="new-password"
          [value]="forceNewPassword()"
          (input)="forceNewPassword.set(fNewPw.value)"
          #fNewPw
        />
        <button type="button" class="btn join-item" (click)="forceShowPasswords.set(!forceShowPasswords())">
          {{ forceShowPasswords() ? 'Ocultar' : 'Ver' }}
        </button>
      </div>
    </div>

    <div>
      <label class="label text-sm font-semibold">Confirmar nueva contraseña</label>
      <input
        [type]="forceShowPasswords() ? 'text' : 'password'"
        class="input w-full"
        placeholder="Repite la nueva contrasena"
        autocomplete="new-password"
        [value]="forceConfirmPassword()"
        (input)="forceConfirmPassword.set(fConfirmPw.value)"
        #fConfirmPw
      />
    </div>

    @if (forceError()) {
      <div class="alert alert-error text-sm"><span>{{ forceError() }}</span></div>
    }

    @if (forceMessage()) {
      <div class="alert alert-success text-sm"><span>{{ forceMessage() }}</span></div>
    }

    <button
      type="button"
      class="btn bg-red-600 text-white hover:bg-red-700"
      [disabled]="forceLoading()"
      (click)="submitForceChange()"
    >
      @if (forceLoading()) {
        Cambiando...
      } @else {
        Cambiar contraseña
      }
    </button>
  </div>
</div>
}
