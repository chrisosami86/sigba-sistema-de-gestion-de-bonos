<dialog id="my_modal_2" class="modal">
  <div class="modal-box flex flex-col gap-4">
    <h3 class="text-lg font-bold">Recuperar contrasena</h3>
    <p class="text-sm text-gray-600">Digita el correo registrado en la base de datos.</p>

    <input
      type="email"
      class="input w-full"
      placeholder="correo@ejemplo.com"
      [value]="correo()"
      (input)="correo.set(txtCorreo.value)"
      #txtCorreo
    />

    @if (message()) {
      <div class="alert alert-success text-sm">
        <span>{{ message() }}</span>
      </div>
    }

    @if (errorMessage()) {
      <div class="alert alert-error text-sm">
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <button type="button" class="btn bg-red-600 text-white hover:bg-red-800" [disabled]="loading()" (click)="recoverPassword()">
      @if (loading()) {
        Enviando...
      } @else {
        Enviar recuperacion
      }
    </button>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
</dialog>
